name: Build lecture-6 lecture-test bundles (temporary)
on:
  push:
    branches: [lecture-test-regional-complete]
permissions:
  contents: write
jobs:
  rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - name: Compile site and lecture test
        run: python build.py
      - name: Run question bank style audit
        run: python tools/check_lecture_test.py lecture-tests/lecture-6.md
      - name: Commit generated assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- content.js content index.html stats.html sw.js
          if ! git diff --cached --quiet; then
            git commit -m "Regenerate site bundles for lecture-6 lecture test"
            git push origin HEAD:lecture-test-regional-complete
          fi
