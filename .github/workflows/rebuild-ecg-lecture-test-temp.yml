name: Rebuild ECG lecture-test bundles (temporary)
on:
  push:
    branches: [lecture-test-ecg-v1]
permissions:
  contents: write
jobs:
  rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - name: Compile lecture-test bundles
        run: python build.py
      - name: Commit generated files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- content.js content index.html stats.html sw.js
          if ! git diff --cached --quiet; then
            git commit -m "Regenerate site bundles for the ECG lecture test"
            git push origin HEAD:lecture-test-ecg-v1
          fi
