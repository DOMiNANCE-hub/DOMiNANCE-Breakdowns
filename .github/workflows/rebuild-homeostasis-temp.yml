name: Rebuild Homeostasis bundles (temporary)
on:
  push:
    branches: [lecture-test-homeostasis]
permissions:
  contents: write
jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - run: python build.py
      - name: Commit compiled files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- content.js content index.html stats.html sw.js
          if ! git diff --cached --quiet; then
            git commit -m "Recompile Homeostasis lecture test bundles"
            git push origin HEAD:lecture-test-homeostasis
          fi
