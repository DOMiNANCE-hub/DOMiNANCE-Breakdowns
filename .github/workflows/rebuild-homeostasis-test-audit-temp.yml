name: Rebuild Homeostasis test after question audit (temporary)
on:
  push:
    branches: [lecture-test-circulation-3]
permissions:
  contents: write
jobs:
  rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - run: python build.py
      - name: Commit regenerated site bundles
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- content.js content index.html stats.html sw.js
          if ! git diff --cached --quiet; then
            git commit -m "Regenerate Homeostasis bundle after academic question audit"
            git push origin HEAD:lecture-test-circulation-3
          fi
