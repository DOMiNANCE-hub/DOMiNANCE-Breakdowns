<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Breakdowns Insights</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400..800&family=Plus+Jakarta+Sans:wght@700..800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f4f7fc;--sheet:#fff;--sheet2:#f7f9fd;--text:#1d2939;--muted:#5f6c80;--line:#dfe6f1;--navy:#153c86;--blue:#2457d6;--ok:#13795b;--bad:#c2410c;--gold:#b9820f}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#0e1828;--sheet:#14223a;--sheet2:#192a46;--text:#e6ecf5;--muted:#9eabbf;--line:#273a5c;--navy:#bcd0ff;--blue:#8fb2ff;--ok:#4fc79b;--bad:#ff9a6b;--gold:#e0b14a}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px/1.55 'DM Sans',system-ui,sans-serif}
.wrap{width:min(1100px,calc(100% - 32px));margin:0 auto;padding:28px 0 60px}
h1{font:800 26px/1.2 'Plus Jakarta Sans',sans-serif;color:var(--navy);margin:0 0 4px}
h2{font:800 18px/1.3 'Plus Jakarta Sans',sans-serif;color:var(--navy);margin:0 0 12px}
.sub{color:var(--muted);margin:0 0 22px}
.card{background:var(--sheet);border:1px solid var(--line);border-radius:18px;padding:18px 20px;margin-bottom:18px}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:18px}
.tile{background:var(--sheet);border:1px solid var(--line);border-radius:16px;padding:14px 16px}
.tile b{display:block;font:800 26px/1.1 'Plus Jakarta Sans',sans-serif;color:var(--navy)}
.tile span{color:var(--muted);font-size:13px}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--line);vertical-align:top}
th{color:var(--muted);font-weight:600;font-size:12.5px}
td.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.scroll{overflow-x:auto}
.bars{display:flex;align-items:flex-end;gap:3px;height:90px;margin-top:6px}
.bars i{flex:1;background:var(--blue);border-radius:3px 3px 0 0;min-height:2px;opacity:.85}
.q{padding:14px 0;border-bottom:1px solid var(--line)}.q:last-child{border:0}
.q p{margin:0 0 8px;font-weight:600}
.q .meta{color:var(--muted);font-size:13px;font-weight:400}
.opt{display:grid;grid-template-columns:22px 1fr 54px;gap:8px;align-items:center;font-size:13.5px;margin:4px 0}
.opt .track{height:8px;border-radius:4px;background:var(--sheet2);overflow:hidden}
.opt .fill{height:100%;background:var(--muted)}
.opt.right .fill{background:var(--ok)}.opt.right b{color:var(--ok)}
.opt .txt{grid-column:2/4;color:var(--muted);font-size:12.5px;margin-top:-2px}
.flag{display:inline-block;font-size:12px;font-weight:700;color:var(--bad);margin-left:6px}
.note{padding:12px 0;border-bottom:1px solid var(--line)}.note:last-child{border:0}
.note .where{font-size:12.5px;color:var(--muted)}
.kind{display:inline-block;font-size:11.5px;font-weight:700;border-radius:999px;padding:1px 8px;margin-right:6px;background:var(--sheet2);border:1px solid var(--line)}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:18px}
form.key{display:flex;gap:8px;flex-wrap:wrap}
input,button{font:inherit;border-radius:12px;border:1px solid var(--line);padding:10px 12px;background:var(--sheet);color:var(--text)}
button{background:#1d4caf;color:#fff;border-color:#1d4caf;font-weight:700;cursor:pointer}
.empty{color:var(--muted)}
a{color:var(--blue)}
</style>
</head>
<body>
<main class="wrap">
  <h1>Breakdowns Insights</h1>
  <p class="sub">What students read, where they struggle and what they tell you. Anonymous; updated live.</p>
  <div id="app"><div class="card"><form class="key" id="key-form"><label for="key" class="sub" style="margin:0;align-self:center">Dashboard key</label><input id="key" type="password" autocomplete="current-password" required><button>Open</button></form></div></div>
</main>
<script src="content/index.js?v=4c522929d3"></script>
<script>
(() => {
  'use strict';
  const app = document.getElementById('app');
  const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;'}[c]));
  const topics = window.DOMINANCE_TOPICS || [];
  const title = slug => topics.find(t => t.slug === slug)?.title || slug;
  const sectionTitle = (slug, id) => topics.find(t => t.slug === slug)?.sections.find(s => s.id === id)?.title || '';
  const link = (slug, id) => `/#/physiology/cvs/${slug}${id ? '?section=' + encodeURIComponent(id) : ''}`;
  const pct = (a, b) => (b ? Math.round(100 * a / b) : 0);
  const sum = o => Object.values(o || {}).reduce((a, b) => a + b, 0);

  // Question wording, options and keys come from the published chapter files.
  async function questionBank(slugs) {
    const files = (window.DOM_BUNDLE || {}).chapters || {};
    const tests = (window.DOM_BUNDLE || {}).tests || {};
    const load = src => new Promise(r => { const el = document.createElement('script'); el.src = src; el.onload = el.onerror = r; document.head.append(el); });
    await Promise.all([...slugs.filter(s => files[s]).map(s => load(files[s])),
      ...slugs.filter(s => s.startsWith('lt-') && tests[s.slice(3)]).map(s => load(tests[s.slice(3)].file))]);
    const bank = {};
    // Lecture-test questions
    for (const t of Object.values(window.DOM_TESTS || {})) for (const q of t.questions) bank[q.id] = {slug: q.chapter, section: q.section, stem: '[Lecture test] ' + q.stem, options: q.options, key: q.answer};
    for (const [slug, html] of Object.entries(window.DOM_CHAPTERS || {})) {
      const doc = new DOMParser().parseFromString(html, 'text/html');
      let section = '';
      doc.body.querySelectorAll('h2[id], details.mcq-answer[data-qid]').forEach(el => {
        if (el.tagName === 'H2') { section = el.id; return; }
        const p = el.previousElementSibling;
        const options = {};
        p?.querySelectorAll('.mcq-option').forEach(o => { options[o.dataset.option] = o.textContent.replace(/^[A-F]\.\s*/, ''); });
        const stem = [...(p?.childNodes || [])].filter(n => !(n.classList && n.classList.contains('mcq-options'))).map(n => n.textContent).join('').replace(/^\s*\d+\.\s*/, '').trim();
        bank[el.dataset.qid] = {slug, section, stem, options, key: el.dataset.answer};
      });
    }
    return bank;
  }

  async function open(key) {
    app.innerHTML = '<div class="card empty">Loading…</div>';
    const r = await fetch('/api/stats', {headers: {'x-stats-key': key}}).catch(() => null);
    if (!r || r.status === 401) { try { localStorage.removeItem('dom-stats-key'); } catch {} app.innerHTML = '<div class="card">That key didn’t work. <a href="">Try again</a>.</div>'; return; }
    if (r.status === 503) { app.innerHTML = '<div class="card">The database isn’t connected yet. In Vercel: project → Storage → Create Database → Upstash for Redis → connect it to this project.</div>'; return; }
    if (!r.ok) { app.innerHTML = '<div class="card">Couldn’t load the numbers. Refresh to try again.</div>'; return; }
    try { localStorage.setItem('dom-stats-key', key); } catch {}
    const d = await r.json();
    const bank = await questionBank([...new Set(d.questions.map(q => q.id.split(':')[0]))]);
    const views = sum(d.views), answers = d.questions.reduce((a, q) => a + q.total, 0);
    const maxDay = Math.max(1, ...d.daily.map(x => x.views));
    const chapters = topics.map(t => {
      const depth = d.depth[t.slug] || {};
      const reads = sum(depth);
      return {t, views: d.views[t.slug] || 0, finished: pct((depth['75'] || 0) + (depth['100'] || 0), reads), up: d.votes.up[t.slug] || 0, down: d.votes.down[t.slug] || 0};
    }).sort((a, b) => b.views - a.views);
    const hardest = d.questions.filter(q => q.total >= 5 && bank[q.id]).map(q => ({...q, rate: q.right / q.total})).sort((a, b) => a.rate - b.rate).slice(0, 25);
    const topList = (o, n, fmt = k => esc(k)) => { const rows = Object.entries(o || {}).sort((a, b) => b[1] - a[1]).slice(0, n); return rows.length ? `<table>${rows.map(([k, v]) => `<tr><td>${fmt(k)}</td><td class="n">${v}</td></tr>`).join('')}</table>` : '<p class="empty">Nothing yet.</p>'; };
    const glossary = window.DOM_GLOSSARY || {};

    app.innerHTML = `
      <div class="tiles">
        <div class="tile"><b>${views}</b><span>chapter opens</span></div>
        <div class="tile"><b>${answers}</b><span>questions answered</span></div>
        <div class="tile"><b>${sum(d.votes.up)}</b><span>“clear” votes</span></div>
        <div class="tile"><b>${sum(d.votes.down)}</b><span>“not really” votes</span></div>
        <div class="tile"><b>${d.notes.length}</b><span>notes from students</span></div>
      </div>
      <div class="card"><h2>Chapter opens, last 28 days</h2><div class="bars" role="img" aria-label="Daily chapter opens over the last 28 days">${d.daily.slice().reverse().map(x => `<i style="height:${Math.round(100 * x.views / maxDay)}%" title="${x.day}: ${x.views}"></i>`).join('')}</div></div>
      <div class="card"><h2>Notes from students</h2>${d.notes.length ? d.notes.map(n => `<div class="note"><span class="kind">${esc(n.kind)}</span><span class="where"><a href="${link(n.chapter, n.section)}" target="_blank" rel="noopener">${esc(title(n.chapter))}${n.section ? ' · ' + esc(sectionTitle(n.chapter, n.section)) : ''}</a>${n.question && bank[n.question] ? ' · “' + esc(bank[n.question].stem.slice(0, 80)) + '…”' : ''} · ${esc(new Date(n.at).toLocaleString())}</span><div>${esc(n.text)}</div></div>`).join('') : '<p class="empty">No notes yet.</p>'}</div>
      <div class="card"><h2>Chapters</h2><div class="scroll"><table><tr><th>Chapter</th><th class="n">Opens</th><th class="n">Read to the end</th><th class="n">👍</th><th class="n">👎</th></tr>${chapters.map(c => `<tr><td><a href="${link(c.t.slug)}" target="_blank" rel="noopener">${esc(c.t.title)}</a></td><td class="n">${c.views}</td><td class="n">${c.views ? c.finished + '%' : '–'}</td><td class="n">${c.up}</td><td class="n">${c.down}</td></tr>`).join('')}</table></div></div>
      <div class="card"><h2>Hardest questions</h2><p class="sub" style="margin-top:-6px">Questions answered at least 5 times, lowest score first. Options almost nobody picks are marked: they aren’t working as distractors.</p>${hardest.length ? hardest.map(q => { const b = bank[q.id]; return `<div class="q"><p>${esc(b.stem)} <span class="meta">· <a href="${link(b.slug, b.section)}" target="_blank" rel="noopener">${esc(title(b.slug))}</a> · ${pct(q.right, q.total)}% right of ${q.total}</span></p>${Object.keys(b.options).map(o => { const n = q.options[o] || 0, share = pct(n, q.total); return `<div class="opt${o === b.key ? ' right' : ''}"><b>${o}</b><div class="track"><div class="fill" style="width:${share}%"></div></div><span class="n">${share}%${o !== b.key && share < 5 && q.total >= 20 ? '<span class="flag">weak</span>' : ''}</span><span class="txt">${esc(b.options[o])}</span></div>`; }).join('')}</div>`; }).join('') : '<p class="empty">Not enough answers yet.</p>'}</div>
      <div class="two">
        <div class="card"><h2>Tooltips opened most</h2>${topList(d.tips, 20, k => esc((glossary[k] || [k])[0]))}</div>
        <div class="card"><h2>Searches that found nothing</h2>${topList(d.searchMisses, 20)}</div>
      </div>
      <div class="card"><h2>Recordings and videos played</h2>${topList(d.media, 20)}</div>`;
  }
  // Tooltip names for the "Tooltips opened most" list.
  const g = document.createElement('script');
  g.src = (window.DOM_BUNDLE?.core || []).find(f => f.startsWith('glossary.js')) || 'glossary.js';
  document.head.append(g);
  // The private link carries the key after '#', which never leaves the device. It is remembered here,
  // so the dashboard opens straight away next time, and the key is then removed from the address bar.
  const fromLink = new URLSearchParams(location.hash.slice(1)).get('key');
  if (fromLink) { try { localStorage.setItem('dom-stats-key', fromLink); } catch {} history.replaceState(null, '', location.pathname); }
  let saved = fromLink;
  try { saved = saved || localStorage.getItem('dom-stats-key'); } catch {}
  document.getElementById('key-form')?.addEventListener('submit', e => { e.preventDefault(); open(document.getElementById('key').value.trim()); });
  if (saved) open(saved);
})();
</script>
</body>
</html>
