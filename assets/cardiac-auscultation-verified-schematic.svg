<title id="title">Cardiac auscultation points on the anterior chest</title>
<desc id="desc">Schematic frontal chest view. Patient's right is at image left. Aortic at patient's right second intercostal space; pulmonary at patient's left second; Erb's at patient's left third; tricuspid at patient's left fourth to fifth near sternum; mitral at patient's left fifth intercostal space near midclavicular line.</desc>
